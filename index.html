<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC GIS Dashboard</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: #f8fafc;
    }

    /* Top Navbar Header */
    .header {
      height: 56px;
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e40af;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-badge {
      background-color: #f1f5f9;
      color: #475569;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #e2e8f0;
    }

    .live-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #64748b;
      margin-left: 8px;
    }

    /* Main Container */
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      position: relative;
    }

    /* Sidebar Panel */
    .sidebar {
      width: 260px;
      background-color: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      z-index: 999;
      box-shadow: 2px 0 5px rgba(0,0,0,0.03);
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sidebar-header span {
      font-size: 12px;
      color: #2563eb;
      font-weight: 600;
    }

    .sidebar-content {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #1e40af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 16px;
      margin-bottom: 12px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    /* Layer Item & Switch Toggle */
    .layer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
      color: #334155;
    }

    .layer-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: inline-block;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #2563eb;
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    /* Map Box */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      background: #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <div class="header">
    <div class="brand-title">SMC GIS Dashboard</div>
    <div class="header-stats">
      <div class="stat-badge">26 Wards</div>
      <div class="stat-badge">39 Health Units</div>
      <div class="stat-badge">17 Emergency</div>
      <div class="live-toggle">
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
        <span>Live System</span>
      </div>
    </div>
  </div>

  <!-- Main Body Content -->
  <div class="container">
    
    <!-- Left Layer Catalog Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Layer Catalog</h2>
        <span>Layers</span>
      </div>

      <div class="sidebar-content">
        <!-- Base Maps Section -->
        <div class="section-title">Base Maps</div>
        
        <div class="layer-row">
          <span>Google Satellite</span>
          <label class="switch">
            <input type="checkbox" id="toggle-sat" checked onchange="switchBaseMap('sat')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-row">
          <span>Google Terrain</span>
          <label class="switch">
            <input type="checkbox" id="toggle-terrain" onchange="switchBaseMap('terrain')">
            <span class="slider"></span>
          </label>
        </div>

        <!-- Map Layers Section -->
        <div class="section-title">Map Layers</div>

        <div class="layer-row">
          <div class="layer-info">
            <span class="legend-color" style="background-color: #84cc16;"></span>
            <span>Buildings</span>
          </div>
          <label class="switch">
            <input type="checkbox" checked onchange="toggleLayer(buildingsLayer)">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-row">
          <div class="layer-info">
            <span class="legend-color" style="background-color: #a3e635;"></span>
            <span>Landuse</span>
          </div>
          <label class="switch">
            <input type="checkbox" checked onchange="toggleLayer(landuseLayer)">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-row">
          <div class="layer-info">
            <span class="legend-color" style="background-color: #94a3b8;"></span>
            <span>Places</span>
          </div>
          <label class="switch">
            <input type="checkbox" checked onchange="toggleLayer(placesLayer)">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-row">
          <div class="layer-info">
            <span class="legend-color" style="background-color: #f43f5e;"></span>
            <span>POIs</span>
          </div>
          <label class="switch">
            <input type="checkbox" checked onchange="toggleLayer(poisLayer)">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-row">
          <div class="layer-info">
            <span class="legend-color" style="background-color: #fb923c;"></span>
            <span>POIs 1</span>
          </div>
          <label class="switch">
            <input type="checkbox" checked onchange="toggleLayer(pois1Layer)">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-row">
          <div class="layer-info">
            <span class="legend-color" style="background-color: #e11d48;"></span>
            <span>Railways</span>
          </div>
          <label class="switch">
            <input type="checkbox" checked onchange="toggleLayer(railwaysLayer)">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-row">
          <div class="layer-info">
            <span class="legend-color" style="background-color: #38bdf8;"></span>
            <span>Roads</span>
          </div>
          <label class="switch">
            <input type="checkbox" checked onchange="toggleLayer(roadsLayer)">
            <span class="slider"></span>
          </label>
        </div>

      </div>
    </div>

    <!-- Map View Area -->
    <div id="map"></div>
  </div>

  <!-- Leaflet JS Library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Map View
    const map = L.map('map').setView([17.655, 75.391], 12);

    // Base Maps Definitions
    const satelliteTile = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Google Satellite'
    }).addTo(map);

    const terrainTile = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: 'Google Terrain'
    });

    // Base Map Switcher logic
    function switchBaseMap(type) {
      if (type === 'sat') {
        document.getElementById('toggle-terrain').checked = false;
        map.removeLayer(terrainTile);
        satelliteTile.addTo(map);
      } else {
        document.getElementById('toggle-sat').checked = false;
        map.removeLayer(satelliteTile);
        terrainTile.addTo(map);
      }
    }

    // Layer Groups
    const buildingsLayer = L.layerGroup().addTo(map);
    const landuseLayer = L.layerGroup().addTo(map);
    const placesLayer = L.layerGroup().addTo(map);
    const poisLayer = L.layerGroup().addTo(map);
    const pois1Layer = L.layerGroup().addTo(map);
    const railwaysLayer = L.layerGroup().addTo(map);
    const roadsLayer = L.layerGroup().addTo(map);

    // Adding sample feature markers
    L.circleMarker([17.655, 75.391], {
      radius: 8,
      fillColor: "#f43f5e",
      color: "#ffffff",
      weight: 2,
      opacity: 1,
      fillOpacity: 0.9
    }).bindPopup("Akkalkot Central Point").addTo(poisLayer);

    L.polygon([
      [17.660, 75.385],
      [17.665, 75.395],
      [17.650, 75.400],
      [17.645, 75.388]
    ], {
      color: '#f43f5e',
      fillColor: '#fda4af',
      fillOpacity: 0.5
    }).bindPopup("Area Boundary").addTo(landuseLayer);

    // Toggle Layer Visibility
    function toggleLayer(layer) {
      if (map.hasLayer(layer)) {
        map.removeLayer(layer);
